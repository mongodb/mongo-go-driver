name: Merge up
on:
  push:
    branches:
      - release/*.*
      - v*
permissions:
  contents: read
jobs:
  merge-up:
    name: Create merge up pull request
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: mongodb-labs/drivers-github-tools/secure-checkout@89904229eb55a063655af02f5838bd7fe76505e5 #v3
        with:
          app_id: ${{ vars.PR_APP_ID }}
          private_key: ${{ secrets.PR_APP_PRIVATE_KEY }}
          # Make sure to include fetch-depth 0 so all branches are fetched, not
          # just the current one
          fetch-depth: 0
      - name: Create pull request
        id: create-pull-request
        uses: alcaeus/automatic-merge-up-action@874dd723d79cb95bb2360bfeb46b6964060aa515 #v1.1.0
        with:
          ref: ${{ github.ref_name }}
          branchNamePattern: "release/<major>.<minor>"
          devBranchNamePattern: "v<major>"
          fallbackBranch: "master"
          ignoredBranches: ${{ vars.IGNORED_MERGE_UP_BRANCHES }}
          enableAutoMerge: true
