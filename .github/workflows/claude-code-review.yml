name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # review only
      pull-requests: read
      issues: read
      id-token: write # required: OIDC token for Claude GitHub App auth
    env:
      # Route all Claude API traffic through MongoDB's Grove gateway,
      # not api.anthropic.com
      ANTHROPIC_BASE_URL: ${{ secrets.GROVE_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run code review
        uses: anthropics/claude-code-action@v1
        with:
          # Parameter name is fixed by the action; the VALUE is our Grove key
          anthropic_api_key: ${{ secrets.GROVE_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment posts the review on the PR itself (inline per finding,
          # or one summary comment if nothing found)
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-opus-5-5
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
